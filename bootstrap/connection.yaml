AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Onward Logistics sales day - bootstrap step 1. The connection between AWS and
  GitHub that CloudFormation GitSync uses to read the infrastructure repository.

# A new connection starts as PENDING. GitHub requires a person to approve it
# once in the browser (an OAuth handshake that cannot be automated). After
# that single approval nothing else is done by hand.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  Purpose:
    Type: String
    Default: salesday
  Owner:
    Type: String

Resources:
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub 'onward-${Environment}-${Purpose}'
      ProviderType: GitHub
      Tags:
        - {Key: Project, Value: onward}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Environment, Value: !Ref Environment}

Outputs:
  ConnectionArn:
    Value: !Ref GitHubConnection
    Export: {Name: !Sub '${AWS::StackName}-ConnectionArn'}
