AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Onward Logistics sales day - bootstrap step 2. Tells CloudFormation GitSync
  to keep the stack in sync with this repository, and gives it a role to do
  so. After this, the stack is created and updated by a Git push.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  Purpose:
    Type: String
    Default: salesday
  Owner:
    Type: String
  ConnectionArn:
    Type: String
    Description: >-
      ARN of an approved GitHub connection: the output of connection.yaml, or
      a connection the account already has.
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns this repository.
  RepositoryName:
    Type: String
  Branch:
    Type: String
    Default: main

Resources:
  RepositoryLink:
    Type: AWS::CodeStarConnections::RepositoryLink
    Properties:
      ConnectionArn: !Ref ConnectionArn
      OwnerId: !Ref GitHubOwner
      RepositoryName: !Ref RepositoryName
      Tags:
        - {Key: Project, Value: onward}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Environment, Value: !Ref Environment}

  # ------------------------------------------------------- GitSync role ----
  # Two managed policies, kept apart so each can be read on its own:
  #   gitsync  what GitSync needs to drive CloudFormation (from the AWS docs)
  #   deploy   what the stack in this repository is allowed to create
  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-${Purpose}-gitsync'
      Description: Permissions CloudFormation GitSync needs to create and run change sets.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SyncToCloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: PolicyForManagedRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
            Resource: '*'
            Condition:
              StringEquals:
                'events:ManagedBy': [cloudformation.sync.codeconnections.amazonaws.com]
          - Sid: PolicyForDescribingRule
            Effect: Allow
            Action: events:DescribeRule
            Resource: '*'

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-${Purpose}-deploy'
      Description: What the stack in this repository may create. IAM is limited to onward-* names.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ServicesUsedByTheTemplate
            Effect: Allow
            Action:
              - autoscaling:*
              - cloudwatch:*
              - dynamodb:*
              - ec2:*
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: ReadLatestAmazonLinuxImage
            Effect: Allow
            Action: ssm:GetParameters
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*'
          - Sid: OnwardSsmDocumentsOnly
            Effect: Allow
            Action:
              - ssm:AddTagsToResource
              - ssm:CreateDocument
              - ssm:DeleteDocument
              - ssm:DescribeDocument
              - ssm:GetDocument
              - ssm:ListTagsForResource
              - ssm:RemoveTagsFromResource
              - ssm:UpdateDocument
              - ssm:UpdateDocumentDefaultVersion
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/onward-*'
          - Sid: OnwardRolesOnly
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/onward-*'
          - Sid: AttachOnlyKnownPolicies
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/onward-*'
            Condition:
              ArnLike:
                'iam:PolicyARN':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/onward-*'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
          - Sid: OnwardPoliciesOnly
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/onward-*'
          - Sid: OnwardInstanceProfilesOnly
            Effect: Allow
            Action:
              - iam:AddRoleToInstanceProfile
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/onward-*'
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'

  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'onward-${Environment}-${Purpose}-gitsync'
      Description: Used by CloudFormation GitSync to deploy the stack in this repository.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CfnGitSyncTrustPolicy
            Effect: Allow
            Principal:
              Service:
                - cloudformation.sync.codeconnections.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref GitSyncPolicy
        - !Ref DeployPolicy
      Tags:
        - {Key: Project, Value: onward}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Environment, Value: !Ref Environment}

  # ----------------------------------------------------------- The sync ----
  # Watches one deployment file. That file names the template and holds the
  # stack's parameters and tags.
  StackSync:
    Type: AWS::CodeStarConnections::SyncConfiguration
    Properties:
      SyncType: CFN_STACK_SYNC
      ResourceName: !Sub 'onward-${Environment}-${Purpose}'
      RepositoryLinkId: !GetAtt RepositoryLink.RepositoryLinkId
      Branch: !Ref Branch
      ConfigFile: !Sub 'infra/deployments/${Environment}.yaml'
      RoleArn: !GetAtt GitSyncRole.Arn
      PublishDeploymentStatus: ENABLED
      TriggerResourceUpdateOn: FILE_CHANGE
